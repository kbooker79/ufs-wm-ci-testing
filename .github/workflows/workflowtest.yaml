# This is a basic workflow that is manually triggered

name: UFS Community Test Self Hosted Runners

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  # uncomment to run on push
  #push:
    #branches:
      #- main
  workflow_dispatch:

jobs:
  run-on-runners:
    name: Execute on Selected Runner
    strategy:
      matrix:
        runner: [orion, hercules, gaeac6, ursa]
    
    # self-hosted is required, followed by the specific runner label from the matrix
    runs-on: [self-hosted, "${{ matrix.runner }}"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
         submodules: recursive
        
      - name: Perform a basic UFS Weather Model build 
        run: |
          echo "Running on runner: ${{ matrix.runner }}"
          module use modulefiles
          module load ufs_${{ matrix.runner }}.intel
          export CMAKE_FLAGS="-DAPP=ATM -DCCPP_SUITES=FV3_GFS_v17_p8"
          ./build.sh 
          
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0C7AJ84X3P", 
              "text": ":epic: *${{ github.workflow }}* completed on *${{ matrix.runner }}* with status: *${{ job.status }}*\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            }
